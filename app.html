<title>StockFlow</title>

<style>
:root{--navy:#0B1F3A;--blue:#2563EB;--sky:#E0F2FE;--ink:#0f172a;--mut:#64748b;--line:#e6ebf3;--bg:#f5f7fb;--ok:#0f9d6b;--warn:#d97706;--bad:#dc2626;--r:14px}
*{box-sizing:border-box;margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-text-size-adjust:100%}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hidden{display:none!important}
.app{display:flex;min-height:100vh}
#side{width:248px;background:var(--navy);color:#cbd5e1;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;padding:18px 14px;z-index:30;transition:transform .25s}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:19px;padding:4px 8px 18px;letter-spacing:-.01em}
.logo{width:34px;height:34px;border-radius:10px;background:var(--blue);display:grid;place-items:center}
.grp{font-size:12px;color:#7d90ad;padding:14px 12px 6px;font-weight:600}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:#b6c3d9;text-decoration:none;font-weight:600;margin-bottom:2px}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.on{background:var(--blue);color:#fff}
.nav .cnt{margin-left:auto;background:#f59e0b;color:#1b1300;border-radius:99px;font-size:11px;padding:2px 8px;font-weight:800}
.sfoot{margin-top:auto;background:rgba(255,255,255,.07);border-radius:12px;padding:12px;color:#fff}
.sfoot small{display:block;color:#9fb0cb;margin-top:2px}
.sfoot .btn{width:100%;justify-content:center;margin-top:10px;background:transparent;color:#dbe6f7;border:1px solid rgba(255,255,255,.25)}
#scrim{display:none;position:fixed;inset:0;background:rgba(11,31,58,.5);z-index:25}
#scrim.on{display:block}
.main{margin-left:248px;flex:1;min-width:0;padding-bottom:90px}
.top{position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 22px;z-index:20;min-height:60px}
.top b{font-weight:700}
.top .sp{flex:1}
#menuBtn{display:none}
.av{width:36px;height:36px;border-radius:50%;background:var(--sky);color:var(--navy);display:grid;place-items:center;font-weight:800}
#view{padding:22px;max-width:1200px;margin:auto}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
h2{font-size:16px;font-weight:700}
.sub{color:var(--mut);margin-top:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.stat{position:relative}
.stat .l{color:var(--mut);font-weight:600}
.stat .v{font-size:26px;font-weight:800;margin:8px 0 4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .s{color:var(--mut);font-size:12.5px}
.stat .bub{position:absolute;right:16px;top:16px;width:38px;height:38px;border-radius:11px;background:var(--sky);color:var(--blue);display:grid;place-items:center}
.stat.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.stat.navy .l,.stat.navy .s{color:#9fb7da}
.stat.navy .bub{background:rgba(255,255,255,.12);color:#fff}
.stat.warn .bub{background:#fef3c7;color:var(--warn)}
.g2{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.ch{height:260px;position:relative}
.cardh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:600 14px 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:#fff;color:var(--bad);border:1px solid #fecaca}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px}
.ic{background:none;border:0;cursor:pointer;color:var(--mut);display:grid;place-items:center;width:40px;height:40px;border-radius:10px}
.ic:hover{background:#eef2f8}
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;color:var(--mut);font-weight:600;font-size:12.5px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl th.num{text-align:right}
.b{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.b.ok{background:#dcfce7;color:#166534}.b.warn{background:#fef3c7;color:#92400e}.b.bad{background:#fee2e2;color:#991b1b}.b.blue{background:#dbeafe;color:#1e40af}
.tool{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.tool input,.tool select{padding:10px 12px;border:1px solid #cfd8e6;border-radius:10px;font:inherit;font-size:16px;background:#fff}
.tool input{flex:1;min-width:180px}
.empty{text-align:center;color:var(--mut);padding:36px 12px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
.li .t{flex:1;min-width:0}
.li .t b{display:block}
.li .t small{color:var(--mut)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:10px;font-size:12.5px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.party{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.party .card h3{font-size:15px;margin-bottom:6px}
.party .card p{color:var(--mut);margin-bottom:3px;word-break:break-word}
.party .row{display:flex;gap:8px;margin-top:12px}
.ov{position:fixed;inset:0;background:rgba(11,31,58,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:#fff;width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;border-radius:18px 18px 0 0}
.sh-h{display:flex;justify-content:space-between;align-items:center;padding:12px 12px 12px 20px;border-bottom:1px solid var(--line)}
.sh-h h3{font-size:17px}
.sh-b{padding:16px 20px;overflow:auto}
.sh-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
.fld input,.fld select{width:100%;padding:11px 12px;border:1px solid #cfd8e6;border-radius:10px;font:inherit;font-size:16px;background:#fff}
.fld input:disabled{background:#f1f5f9;color:var(--mut)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.err{color:var(--bad);font-weight:600;min-height:18px;margin-top:4px}
.line{display:grid;grid-template-columns:1fr 80px 40px;gap:8px;margin-bottom:8px;align-items:center}
.line select,.line input{padding:10px;border:1px solid #cfd8e6;border-radius:10px;font:inherit;font-size:16px;width:100%;background:#fff}
.tot{display:flex;justify-content:space-between;align-items:center;background:var(--sky);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:16px}
.fab{display:none;position:fixed;right:16px;bottom:18px;z-index:15;box-shadow:0 8px 24px rgba(37,99,235,.4);border-radius:99px;padding:0 20px;min-height:52px}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.show{opacity:1}
.auth{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.auth .bp{background:var(--navy);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.auth .bp h2{font-size:34px;line-height:1.15;letter-spacing:-.02em;font-weight:800;max-width:420px}
.auth .bp p{color:#9fb7da;margin-top:14px;max-width:420px;font-size:15px;line-height:1.5}
.auth .fp{display:grid;place-items:center;padding:24px;background:#fff}
.auth form{width:100%;max-width:380px}
.auth form h1{font-size:26px;margin-bottom:6px}
.auth .mbrand{display:none;align-items:center;gap:10px;font-weight:800;font-size:19px;margin-bottom:22px}
.auth .tog{margin-top:16px;text-align:center;color:var(--mut)}
.auth .tog button{background:none;border:0;color:var(--blue);font:600 14px inherit;cursor:pointer}
.auth .btn{width:100%;justify-content:center}
.auth .ok{color:#166534;background:#dcfce7;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-weight:600}
@media(max-width:1000px){.stats{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr}}
@media(max-width:900px){#side{transform:translateX(-100%)}#side.open{transform:none}.main{margin-left:0}#menuBtn{display:grid}.fab{display:inline-flex}.top{padding:8px 12px}#view{padding:16px 14px}.hide-m{display:none}
.auth{grid-template-columns:1fr}.auth .bp{display:none}.auth .mbrand{display:flex}}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:18px}}
@media(max-width:700px){
.resp thead{display:none}
.resp tr{display:block;border:1px solid var(--line);border-radius:12px;margin:10px 0;padding:6px 12px;background:#fff}
.resp td{display:flex;justify-content:space-between;gap:12px;border:0!important;padding:7px 0;text-align:right}
.resp td::before{content:attr(data-l);color:var(--mut);font-weight:600;text-align:left}
.resp td.act{justify-content:flex-end}.resp td.act::before{content:none}
h1{font-size:22px}
}
@media(max-width:420px){.stats{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="auth" id="auth">
  <div class="bp">
    <div class="brand"><span class="logo" id="logo1"></span>StockFlow</div>
    <div><h2>Know what you have. Sell with confidence.</h2><p>Track products, stock, sales and suppliers in one place, built for Kenyan shops.</p></div>
    <small style="color:#7d90ad">Your business data is stored securely and is never kept in this browser.</small>
  </div>
  <div class="fp"><form id="authf" novalidate></form></div>
</div>

<div class="app hidden" id="app">
  <aside id="side">
    <div class="brand"><span class="logo" id="logo2"></span>StockFlow</div>
    <nav class="nav" id="nav"></nav>
    <div class="sfoot"><b id="sbiz"></b><small id="sown"></small><button class="btn sm" data-a="logout">Log out</button></div>
  </aside>
  <div id="scrim" data-a="menu"></div>
  <div class="main">
    <header class="top">
      <button class="ic" id="menuBtn" data-a="menu" aria-label="Open menu"></button>
      <b id="title">Dashboard</b>
      <span class="sp"></span>
      <button class="btn sm hide-m" data-a="newSale">+ Record sale</button>
      <span class="av" id="av">S</span>
    </header>
    <main id="view"></main>
  </div>
  <button class="btn fab" data-a="newSale">+ New sale</button>
</div>
<div id="modal"></div>
<div id="toast" role="status"></div>

<script>
/* ===== Supabase (public URL + publishable key are safe to ship; never put the secret key here) ===== */
const SB_URL = 'https://ppbalvgvidtiwmdmrvno.supabase.co';
const SB_KEY = 'sb_publishable_yCzOcbKHosbe0GlsBP1i2w_MIxXjD_X';
/* persistSession:false keeps the login only in memory: nothing is written to localStorage/sessionStorage */
const sb = window.supabase ? window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:false, autoRefreshToken:true, detectSessionInUrl:false}}) : null;

/* ===== helpers ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IC = {
  dash:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
  box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  layers:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
  cart:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l3 12h11l2-8H6"/>',
  bag:'<path d="M5 7h14l-1 13H6z"/><path d="M9 7a3 3 0 016 0"/>',
  truck:'<path d="M2 6h12v10H2zM14 10h4l4 3v3h-8"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6"/><path d="M16 4.5a3.5 3.5 0 010 7M22 20c0-3-1.5-5-4-5.7"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>',
  menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  alert:'<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/>',
  trend:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
  wallet:'<path d="M3 7h16a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M3 7l13-3v3M16 14h2"/>'
};
const ic = (n, s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const fmt = n => S.settings.currency + ' ' + Math.round(n).toLocaleString('en-KE');
const dkey = d => new Date(d).toDateString();
const fdt = d => new Date(d).toLocaleString('en-GB', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
const sum = (a, f) => a.reduce((t, x) => t + f(x), 0);

/* ===== in-memory state only. Cleared on logout. ===== */
const blank = () => ({user:null, biz:null, role:null, settings:{business:'', owner:'', currency:'KSh'}, products:[], suppliers:[], customers:[], sales:[], purchases:[], adjust:[]});
let S = blank();
const M = () => S.role === 'owner' || S.role === 'manager';

function dberr(e) {
  const m = (e && e.message) || '';
  if (e && e.code === '23505') return 'That SKU is already used by another product.';
  if (/fetch|network|Failed to/i.test(m)) return 'Could not reach the server. Check your internet and try again.';
  if (/JWT|expired|not signed/i.test(m)) return 'Your session expired. Please log in again.';
  if (e && e.code === '42501') return "You don't have permission to do that.";
  return m || 'Something went wrong. Please try again.';
}

/* ===== load all business data from Supabase ===== */
async function loadAll() {
  const q = (t, sel, o) => sb.from(t).select(sel).order(o, {ascending:o !== 'created_at'}).limit(400);
  const res = await Promise.all([
    q('products', '*', 'name'), q('suppliers', '*', 'name'), q('customers', '*', 'name'),
    q('sales', '*, sale_items(*)', 'created_at'), q('purchases', '*, purchase_items(*)', 'created_at'),
    q('stock_adjustments', '*', 'created_at'),
    sb.from('businesses').select('id,name,currency').limit(1),
    sb.from('profiles').select('full_name,role,business_id').eq('id', S.user.id).limit(1)
  ]);
  const bad = res.find(r => r.error); if (bad) throw bad.error;
  const [pr, su, cu, sa, pu, ad, bz, me] = res.map(r => r.data);
  if (!me[0] || !bz[0]) throw new Error('Your account has no business yet. Please contact support.');
  S.biz = bz[0].id; S.role = me[0].role;
  S.settings = {business:bz[0].name, currency:bz[0].currency || 'KSh', owner:me[0].full_name || S.user.email};
  S.products = pr.map(p => ({id:p.id, name:p.name, sku:p.sku || '', category:p.category || '', buy:+p.buying_price, sell:+p.selling_price, qty:p.quantity, reorder:p.reorder_level ?? 0}));
  S.suppliers = su.map(x => ({id:x.id, name:x.name, phone:x.phone || '', email:x.email || '', address:x.address || ''}));
  S.customers = cu.map(x => ({id:x.id, name:x.name, phone:x.phone || '', email:x.email || '', address:x.address || ''}));
  S.sales = sa.map(s => ({id:s.ref, date:s.created_at, customer:s.customer || 'Walk-in', method:s.method || '', total:+s.total, items:(s.sale_items || []).map(i => ({name:i.name, qty:i.qty, price:+i.price, cost:+i.cost}))}));
  S.purchases = pu.map(s => ({id:s.ref, date:s.created_at, supplier:s.supplier || '', total:+s.total, items:(s.purchase_items || []).map(i => ({name:i.name, qty:i.qty, cost:+i.cost}))}));
  S.adjust = ad.map(a => ({id:'AD-' + a.id.slice(0, 4).toUpperCase(), date:a.created_at, name:a.name, change:a.change, reason:a.reason || ''}));
}
async function refresh() { await loadAll(); render(); }

/* ===== toast + modal ===== */
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800); }
function closeModal() { $('#modal').innerHTML = ''; }
function modal(title, body, onSubmit, btn = 'Save') {
  $('#modal').innerHTML = `<div class="ov" data-a="closeOv"><form class="sheet" id="mf" novalidate>
    <div class="sh-h"><h3>${title}</h3><button type="button" class="ic" data-a="close" aria-label="Close">${ic('x')}</button></div>
    <div class="sh-b">${body}<p class="err" id="merr"></p></div>
    <div class="sh-f"><button type="button" class="btn ghost" data-a="close">Cancel</button><button class="btn" id="msave">${btn}</button></div></form></div>`;
  $('#mf').onsubmit = async e => {
    e.preventDefault();
    const f = e.target, b = $('#msave'), old = b.textContent;
    b.disabled = true; b.textContent = 'Saving...'; $('#merr').textContent = '';
    let err; try { err = await onSubmit(f); } catch (x) { err = dberr(x); }
    if (err) { $('#merr').textContent = err; b.disabled = false; b.textContent = old; } else closeModal();
  };
}
const status = p => p.qty <= 0 ? ['Out of stock', 'bad'] : p.qty <= p.reorder ? ['Low stock', 'warn'] : ['In stock', 'ok'];
const lowList = () => S.products.filter(p => p.qty <= p.reorder);
const head = (t, s, a = '') => `<div class="ph"><div><h1>${t}</h1><p class="sub">${s}</p></div><div class="acts">${a}</div></div>`;
const badge = (t, c) => `<span class="b ${c}">${t}</span>`;

/* ===== add / edit products, suppliers, customers ===== */
const ENT = {
  products: {one:'product', f:[
    {k:'name', l:'Product name', req:1}, {k:'sku', l:'SKU / code'}, {k:'category', l:'Category', list:1},
    {k:'buy', l:'Buying price', t:'number'}, {k:'sell', l:'Selling price', t:'number', req:1},
    {k:'qty', l:'Starting stock', t:'number', int:1}, {k:'reorder', l:'Reorder level', t:'number', int:1}]},
  suppliers: {one:'supplier', f:[{k:'name', l:'Name', req:1}, {k:'phone', l:'Phone'}, {k:'email', l:'Email'}, {k:'address', l:'Location'}]},
  customers: {one:'customer', f:[{k:'name', l:'Name', req:1}, {k:'phone', l:'Phone'}, {k:'email', l:'Email'}, {k:'address', l:'Location'}]}
};
const fieldHtml = (f, v) => `<label class="fld"><span>${f.l}</span><input name="${f.k}" type="${f.t || 'text'}" value="${esc(v ?? '')}" ${f.t === 'number' ? 'min="0" step="any" inputmode="decimal"' : ''} ${f.list ? 'list="cats"' : ''} autocomplete="off"></label>`;
function openForm(ent, id) {
  const E = ENT[ent], rec = id ? S[ent].find(r => r.id === id) : {};
  const fields = E.f.filter(f => !(id && f.k === 'qty'));
  const cats = [...new Set(S.products.map(p => p.category).filter(Boolean))].map(c => `<option value="${esc(c)}">`).join('');
  const note = id && ent === 'products' ? '<p class="sub" style="margin:0 0 12px">To change the quantity, use Adjust stock in Inventory so every change is recorded.</p>' : '';
  modal((id ? 'Edit ' : 'Add ') + E.one, `${note}<div class="${ent === 'products' ? 'two' : ''}">${fields.map(f => fieldHtml(f, rec[f.k])).join('')}</div><datalist id="cats">${cats}</datalist>`, async form => {
    const d = {};
    for (const f of fields) {
      let v = form.elements[f.k].value.trim();
      if (f.req && !v) return f.l + ' is required.';
      if (f.t === 'number') { v = v === '' ? 0 : Number(v); if (!isFinite(v) || v < 0) return f.l + ' must be 0 or more.'; if (f.int) v = Math.floor(v); }
      d[f.k] = v;
    }
    const row = ent === 'products'
      ? {name:d.name, sku:d.sku || null, category:d.category || null, buying_price:d.buy, selling_price:d.sell, reorder_level:d.reorder, ...(id ? {} : {quantity:d.qty})}
      : {name:d.name, phone:d.phone || null, email:d.email || null, address:d.address || null};
    const {error} = id ? await sb.from(ent).update(row).eq('id', id) : await sb.from(ent).insert({business_id:S.biz, ...row});
    if (error) return dberr(error);
    await refresh(); toast(id ? 'Changes saved' : E.one[0].toUpperCase() + E.one.slice(1) + ' added');
  }, id ? 'Save changes' : 'Add ' + E.one);
}

/* ===== sales, purchases, stock adjustments (server functions do the real work) ===== */
const stockOpts = () => S.products.filter(p => p.qty > 0).map(p => `<option value="${p.id}">${esc(p.name)} (${p.qty} left)</option>`).join('');
const lineHtml = () => `<div class="line"><select name="pid">${stockOpts()}</select><input name="q" type="number" min="1" value="1" inputmode="numeric" aria-label="Quantity"><button type="button" class="ic" data-a="rmLine" aria-label="Remove item">${ic('x')}</button></div>`;
function calcSale() {
  let t = 0;
  document.querySelectorAll('.line').forEach(l => { const p = S.products.find(x => x.id === l.querySelector('[name=pid]').value); t += p ? p.sell * (Number(l.querySelector('[name=q]').value) || 0) : 0; });
  const el = $('#stot'); if (el) el.textContent = fmt(t);
}
function newSale() {
  if (!S.products.some(p => p.qty > 0)) return toast('No products in stock to sell. Add a product first.');
  const cust = ['<option>Walk-in</option>'].concat(S.customers.map(c => `<option>${esc(c.name)}</option>`)).join('');
  modal('Record sale', `<div class="two"><label class="fld"><span>Customer</span><select name="cust">${cust}</select></label>
    <label class="fld"><span>Payment</span><select name="method"><option>Cash</option><option>M-Pesa</option><option>Bank</option><option>Credit</option></select></label></div>
    <div id="lines">${lineHtml()}</div><button type="button" class="btn ghost sm" data-a="addLine">+ Add item</button>
    <div class="tot"><span>Total</span><strong id="stot">${fmt(0)}</strong></div>`, async form => {
    const lines = [...form.querySelectorAll('.line')].map(l => ({product_id:l.querySelector('[name=pid]').value, qty:Math.floor(Number(l.querySelector('[name=q]').value))}));
    if (!lines.length) return 'Add at least one item.';
    if (lines.some(l => !(l.qty > 0))) return 'Enter a quantity of 1 or more for every item.';
    const agg = {}; lines.forEach(l => agg[l.product_id] = (agg[l.product_id] || 0) + l.qty);
    for (const pid in agg) { const p = S.products.find(x => x.id === pid); if (p && agg[pid] > p.qty) return `Only ${p.qty} of ${p.name} in stock.`; }
    const items = Object.entries(agg).map(([product_id, qty]) => ({product_id, qty}));
    const {error} = await sb.rpc('record_sale', {p_customer:form.elements.cust.value, p_method:form.elements.method.value, p_items:items});
    if (error) return dberr(error);
    await refresh(); toast('Sale recorded. Stock updated.');
  }, 'Save sale');
  $('#mf').addEventListener('input', calcSale); calcSale();
}
function newPurchase(pre) {
  if (!M()) return;
  if (!S.products.length) return toast('Add a product first.');
  const first = S.products.find(p => p.id === pre) || S.products[0];
  const sup = S.suppliers.map(s => `<option>${esc(s.name)}</option>`).join('') || '<option>Other supplier</option>';
  const prods = S.products.map(p => `<option value="${p.id}" ${p.id === first.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
  modal('Record purchase', `<label class="fld"><span>Supplier</span><select name="sup">${sup}</select></label>
    <label class="fld"><span>Product</span><select name="pid">${prods}</select></label>
    <div class="two"><label class="fld"><span>Quantity bought</span><input name="q" type="number" min="1" value="10" inputmode="numeric"></label>
    <label class="fld"><span>Cost per unit</span><input name="cost" type="number" min="0" step="any" value="${first.buy}" inputmode="decimal"></label></div>`, async form => {
    const q = Math.floor(Number(form.elements.q.value)), cost = Number(form.elements.cost.value);
    if (!(q > 0)) return 'Quantity must be 1 or more.';
    if (!isFinite(cost) || cost < 0) return 'Cost must be 0 or more.';
    const {error} = await sb.rpc('record_purchase', {p_supplier:form.elements.sup.value, p_items:[{product_id:form.elements.pid.value, qty:q, cost}]});
    if (error) return dberr(error);
    await refresh(); toast('Purchase recorded. Stock increased.');
  }, 'Save purchase');
  $('#mf').elements.pid.addEventListener('change', e => { $('#mf').elements.cost.value = S.products.find(x => x.id === e.target.value).buy; });
}
function adjust(id) {
  if (!M()) return;
  const p = S.products.find(x => x.id === id);
  modal('Adjust stock', `<p class="sub" style="margin:0 0 12px"><b>${esc(p.name)}</b> has ${p.qty} in stock.</p>
    <label class="fld"><span>Change (use a minus to reduce)</span><input name="ch" type="number" step="1" value="-1" inputmode="numeric"></label>
    <label class="fld"><span>Reason</span><select name="why"><option>Stock count</option><option>Damaged</option><option>Expired</option><option>Returned</option><option>Other</option></select></label>`, async form => {
    const ch = Math.trunc(Number(form.elements.ch.value));
    if (!ch) return 'Enter a change other than 0.';
    if (p.qty + ch < 0) return `You can't remove more than the ${p.qty} in stock.`;
    const {error} = await sb.rpc('adjust_stock', {p_product:p.id, p_change:ch, p_reason:form.elements.why.value});
    if (error) return dberr(error);
    await refresh(); toast('Stock adjusted');
  }, 'Save adjustment');
}

/* ===== data views ===== */
function activity() {
  return [
    ...S.sales.map(s => ({ref:s.id, type:'Sale', c:'ok', party:s.customer, items:sum(s.items, i => i.qty), amt:s.total, date:s.date})),
    ...S.purchases.map(s => ({ref:s.id, type:'Purchase', c:'blue', party:s.supplier, items:sum(s.items, i => i.qty), amt:s.total, date:s.date})),
    ...S.adjust.map(a => ({ref:a.id, type:'Adjustment', c:'warn', party:a.name, items:Math.abs(a.change), amt:0, date:a.date}))
  ].sort((a, b) => new Date(b.date) - new Date(a.date));
}
function weekData() {
  const L = [], sa = [], pu = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i); const k = d.toDateString();
    L.push(d.toLocaleDateString('en-GB', {weekday:'short'}));
    sa.push(sum(S.sales.filter(s => dkey(s.date) === k), s => s.total));
    pu.push(sum(S.purchases.filter(s => dkey(s.date) === k), s => s.total));
  }
  return {L, sa, pu};
}
function catData() {
  const m = {}; S.products.forEach(p => { const c = p.category || 'Other'; m[c] = (m[c] || 0) + p.qty * p.sell; });
  return {L:Object.keys(m), V:Object.values(m)};
}
const COLORS = ['#2563EB', '#0B1F3A', '#7dd3fc', '#f59e0b', '#10b981', '#a78bfa'];
const charts = {};
function mk(id, cfg) { const el = document.getElementById(id); if (!el || !window.Chart) return; charts[id] = new Chart(el, cfg); }
function weekChart(id) {
  const w = weekData();
  mk(id, {type:'bar', data:{labels:w.L, datasets:[{label:'Sales', data:w.sa, backgroundColor:'#2563EB', borderRadius:6}, {label:'Purchases', data:w.pu, backgroundColor:'#bfdbfe', borderRadius:6}]},
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}, tooltip:{callbacks:{label:c => ` ${c.dataset.label}: ${fmt(c.parsed.y)}`}}},
      scales:{y:{beginAtZero:true, ticks:{callback:v => v >= 1000 ? v / 1000 + 'k' : v}, grid:{color:'#eef2f8'}}, x:{grid:{display:false}}}}});
}
function catChart(id) {
  const c = catData();
  mk(id, {type:'doughnut', data:{labels:c.L, datasets:[{data:c.V, backgroundColor:COLORS, borderWidth:2}]},
    options:{responsive:true, maintainAspectRatio:false, cutout:'68%', plugins:{legend:{display:false}, tooltip:{callbacks:{label:x => ` ${x.label}: ${fmt(x.parsed)}`}}}}});
}
const legend = () => { const c = catData(); return c.L.length ? `<div class="legend">${c.L.map((l, i) => `<span><i style="background:${COLORS[i % COLORS.length]}"></i>${esc(l)}</span>`).join('')}</div>` : '<p class="sub">Add products to see this chart.</p>'; };

    <p class="err" id="serr"></p><button class="btn" id="sbtn">Save settings</button></form>`;
}

/* ===== router ===== */
const PAGES = {
  dashboard:['Dashboard', 'dash', pgDashboard, 0], products:['Products', 'box', pgProducts, 0], inventory:['Inventory', 'layers', pgInventory, 1],
  sales:['Sales', 'cart', pgSales, 0], purchases:['Purchases', 'bag', pgPurchases, 1],
  suppliers:['Suppliers', 'truck', () => pgParty('suppliers', 'Suppliers', 'The people and companies you buy stock from.'), 1],
  customers:['Customers', 'users', () => pgParty('customers', 'Customers', 'The people and businesses you sell to.'), 0],
  reports:['Reports', 'chart', pgReports, 1], settings:['Settings', 'gear', pgSettings, 1]
};
const GROUPS = [['Workspace', ['dashboard', 'products', 'inventory']], ['Movement', ['sales', 'purchases', 'suppliers', 'customers']], ['Insights', ['reports', 'settings']]];
const allowed = k => PAGES[k] && (!PAGES[k][3] || M());
function render() {
  if (!S.user) return;
  const h = location.hash.slice(1), key = allowed(h) ? h : 'dashboard';
  Object.values(charts).forEach(c => c.destroy()); for (const k in charts) delete charts[k];
  $('#view').innerHTML = PAGES[key][2]();
  $('#title').textContent = PAGES[key][0];
  const n = lowList().length;
  $('#nav').innerHTML = GROUPS.map(([g, ks]) => { const v = ks.filter(allowed); return v.length ? `<div class="grp">${g}</div>` + v.map(k => `<a href="#${k}" class="${k === key ? 'on' : ''}">${ic(PAGES[k][1])}${PAGES[k][0]}${k === 'inventory' && n ? `<span class="cnt">${n}</span>` : ''}</a>`).join('') : ''; }).join('');
  $('#sbiz').textContent = S.settings.business;
  $('#sown').textContent = (S.settings.owner || '') + ' (' + S.role + ')';
  $('#av').textContent = (S.settings.owner || 'S')[0].toUpperCase();
  $('#side').classList.remove('open'); $('#scrim').classList.remove('on');
  if (key === 'dashboard') { weekChart('cWeek'); catChart('cCat'); }
  if (key === 'reports') { weekChart('rWeek'); catChart('rCat'); }
}

/* ===== login / signup ===== */
let mode = 'login', authMsg = '';
function authView(note = '') {
  const su = mode === 'signup';
  $('#authf').innerHTML = `<div class="mbrand"><span class="logo" style="background:var(--blue)">${ic('box').replace('currentColor', '#fff')}</span>StockFlow</div>
    <h1>${su ? 'Create your account' : 'Welcome back'}</h1><p class="sub" style="margin-bottom:18px">${su ? 'Set up your business in under a minute.' : 'Log in to manage your stock.'}</p>
    ${note ? `<div class="ok">${esc(note)}</div>` : ''}
    ${su ? `<label class="fld"><span>Your name</span><input name="fn" autocomplete="name"></label><label class="fld"><span>Business name</span><input name="bn" autocomplete="organization"></label>` : ''}
    <label class="fld"><span>Email</span><input name="em" type="email" autocomplete="email" inputmode="email"></label>
    <label class="fld"><span>Password</span><input name="pw" type="password" autocomplete="${su ? 'new-password' : 'current-password'}"></label>
    <p class="err" id="aerr"></p>
    <button class="btn" id="abtn">${su ? 'Create account' : 'Log in'}</button>
    <div class="tog">${su ? 'Already have an account?' : 'New to StockFlow?'} <button type="button" data-a="toggleAuth">${su ? 'Log in' : 'Create an account'}</button></div>`;
  if (!sb) $('#aerr').textContent = 'Could not load. Check your internet connection and reload the page.';
}
function showAuth(note) { S = blank(); clearTimeout(idleT); $('#app').classList.add('hidden'); $('#auth').classList.remove('hidden'); closeModal(); mode = 'login'; authView(note); }
async function enterApp() {
  $('#auth').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#view').innerHTML = '<div class="empty"><b>Loading your business...</b></div>';
  try { await loadAll(); } catch (e) { await logout(dberr(e)); return; }
  if (!location.hash) location.hash = 'dashboard';
  render(); resetIdle();
}
async function logout(note) { try { await sb.auth.signOut(); } catch (e) {} showAuth(typeof note === 'string' ? note : ''); }
let idleT;
function resetIdle() { clearTimeout(idleT); if (S.user) idleT = setTimeout(() => logout('You were signed out after 30 minutes of inactivity.'), 30 * 60 * 1000); }
['click', 'keydown', 'touchstart', 'scroll'].forEach(ev => document.addEventListener(ev, resetIdle, {passive:true}));

/* ===== events ===== */
const H = {
  menu() { $('#side').classList.toggle('open'); $('#scrim').classList.toggle('on'); },
  close: closeModal, closeOv: closeModal,
  go(d) { location.hash = d.to; },
  logout() { logout(); },
  toggleAuth() { mode = mode === 'login' ? 'signup' : 'login'; authView(); },
  add(d) { openForm(d.e); }, edit(d) { openForm(d.e, d.id); },
  async del(d) {
    const r = S[d.e].find(x => x.id === d.id);
    if (!r || !confirm(`Delete ${r.name}? This can't be undone.`)) return;
    const {error} = await sb.from(d.e).delete().eq('id', d.id);
    if (error) return toast(dberr(error));
    await refresh(); toast('Deleted ' + r.name);
  },
  adjust(d) { adjust(d.id); }, newSale, newPurchase(d) { newPurchase(d.id); },
  addLine() { if (!stockOpts()) return; $('#lines').insertAdjacentHTML('beforeend', lineHtml()); calcSale(); },
  rmLine(d, el) { el.closest('.line').remove(); calcSale(); }
};
document.addEventListener('click', e => {
  const a = e.target.closest('[data-a]'); if (!a) return;
  if (a.dataset.a === 'closeOv' && e.target !== a) return;
  if (H[a.dataset.a]) H[a.dataset.a](a.dataset, a);
});
document.addEventListener('input', e => { if (e.target.id === 'q') $('#prow').innerHTML = rowsProducts(); });
document.addEventListener('change', e => { if (e.target.id === 'sf') $('#prow').innerHTML = rowsProducts(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });

document.addEventListener('submit', async e => {
  if (e.target.id === 'authf') {
    e.preventDefault();
    if (!sb) return;
    const f = e.target.elements, em = f.em.value.trim(), pw = f.pw.value, err = $('#aerr'), btn = $('#abtn');
    err.textContent = '';
    if (!em || !pw) { err.textContent = 'Enter your email and password.'; return; }
    if (mode === 'signup') {
      if (!f.fn.value.trim() || !f.bn.value.trim()) { err.textContent = 'Enter your name and business name.'; return; }
      if (pw.length < 8 || !/[A-Za-z]/.test(pw) || !/\d/.test(pw)) { err.textContent = 'Use at least 8 characters with letters and numbers.'; return; }
    }
    btn.disabled = true; btn.textContent = 'Please wait...';
    try {
      let res;
      if (mode === 'signup') res = await sb.auth.signUp({email:em, password:pw, options:{data:{full_name:f.fn.value.trim(), business_name:f.bn.value.trim()}}});
      else res = await sb.auth.signInWithPassword({email:em, password:pw});
      if (res.error) {
        err.textContent = /not confirmed/i.test(res.error.message) ? 'Confirm your email first, then log in.' : mode === 'signup' ? res.error.message : 'Wrong email or password.';
      } else if (!res.data.session) {
        mode = 'login'; authView('Account created. Check your email to confirm it, then log in.'); return;
      } else { S.user = res.data.user; await enterApp(); return; }
    } catch (x) { err.textContent = dberr(x); }
    btn.disabled = false; btn.textContent = mode === 'signup' ? 'Create account' : 'Log in';
  }
  if (e.target.id === 'setf') {
    e.preventDefault();
    const biz = e.target.elements.biz.value.trim(), cur = e.target.elements.cur.value, err = $('#serr'), btn = $('#sbtn');
    if (!biz) { err.textContent = 'Business name is required.'; return; }
    btn.disabled = true;
    const {error} = await sb.from('businesses').update({name:biz, currency:cur}).eq('id', S.biz);
    if (error) { err.textContent = dberr(error); btn.disabled = false; return; }
    await refresh(); toast('Settings saved');
  }
});

if (sb) sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && S.user) showAuth('You have been signed out.'); });
$('#menuBtn').innerHTML = ic('menu');
const logoSvg = ic('box', 20).replace('currentColor', '#fff');
$('#logo1').innerHTML = logoSvg; $('#logo2').innerHTML = logoSvg;
authView();
</script>
</body>
</html>
